name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Static site: no dependencies or build step, so check the source directly.
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the code
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '22'

      - name: Check JavaScript syntax
        run: node --check script.js

      - name: Validate HTML
        run: npx --yes html-validate@9 index.html
